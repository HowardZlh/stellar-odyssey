# CLA 签署机器人（CLA Assistant Lite）
# 外部贡献者首次提 PR 时自动评论要求签署 CLA.md，未签署则 cla 检查不通过；
# 签名记录存于本仓库 cla-signatures 分支（无第三方服务）。
# job 名 "cla" 被分支保护 ruleset 引用为 required status check，勿随意改名。
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: cla
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/HowardZlh/stellar-odyssey/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'HowardZlh,dependabot[bot],*[bot]'
          custom-notsigned-prcomment: '感谢你的贡献！合并前需要签署本项目的贡献者许可协议（CLA）。请阅读 [CLA 文档](https://github.com/HowardZlh/stellar-odyssey/blob/main/CLA.md)，并在本 PR 中回复以下内容完成签署：'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '✅ 所有贡献者均已签署 CLA。'
