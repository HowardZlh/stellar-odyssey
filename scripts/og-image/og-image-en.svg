<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    英文 Open Graph 分享图矢量源（H 迭代 H5），与 public/og-image.png 同视觉语言
    （深空蓝紫背景 + 恒星与轨道遨游意象），供 /en 落地页与 en 根布局的 og:image 使用。

    栅格化为 public/og-image-en.png（1200×630）：
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
        [headless=new] [disable-gpu] [hide-scrollbars] [window-size=1200,630] \
        [screenshot=public/og-image-en.png] "file://$PWD/scripts/og-image/og-image-en.svg"
      （方括号处为 Chrome 的双连字符长选项；XML 注释内不能出现双连字符，故以方括号代写）
    字体：系统 sans-serif（渲染机字体不同会有细微差异，属可接受范围）。
  -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="110%">
      <stop offset="0%" stop-color="#1c2b5e"/>
      <stop offset="50%" stop-color="#111739"/>
      <stop offset="100%" stop-color="#06081a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd66b" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff9d3c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff9d3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#fff8dc"/>
      <stop offset="45%" stop-color="#ffd66b"/>
      <stop offset="100%" stop-color="#ff8c2e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa8ff"/>
      <stop offset="100%" stop-color="#b48cff"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#c9f1ff"/>
      <stop offset="55%" stop-color="#63d8ff"/>
      <stop offset="100%" stop-color="#2f7fd6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 星野 -->
  <g fill="#ffffff">
    <circle cx="118" cy="90" r="3.5" opacity="0.9"/>
    <circle cx="412" cy="108" r="2.5" opacity="0.6"/>
    <circle cx="176" cy="228" r="2" opacity="0.7"/>
    <circle cx="60" cy="360" r="2.5" opacity="0.6"/>
    <circle cx="236" cy="562" r="3" opacity="0.8"/>
    <circle cx="560" cy="580" r="2.5" opacity="0.6"/>
    <circle cx="1080" cy="68" r="3.5" opacity="0.9"/>
    <circle cx="820" cy="130" r="2.5" opacity="0.5"/>
    <circle cx="1130" cy="300" r="2.5" opacity="0.6"/>
    <circle cx="1180" cy="405" r="2" opacity="0.5"/>
    <circle cx="980" cy="556" r="3" opacity="0.8"/>
    <circle cx="700" cy="548" r="2" opacity="0.5"/>
    <circle cx="640" cy="60" r="2" opacity="0.5"/>
  </g>

  <!-- 恒星辉光 + 轨道 + 恒星 + 行星（左侧构图） -->
  <g transform="translate(285 315)">
    <circle r="230" fill="url(#glow)"/>
    <ellipse rx="215" ry="100" transform="rotate(-25)" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.85"/>
    <circle r="88" fill="url(#sun)"/>
    <circle cx="122" cy="26" r="28" fill="url(#planet)"/>
  </g>

  <!-- 文案（右侧） -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Inter, Arial, sans-serif" fill="#ffffff">
    <text x="570" y="262" font-size="74" font-weight="700" letter-spacing="0.5">Stellar Odyssey</text>
    <text x="570" y="322" font-size="27" fill="#9fc2ff">A scroll-wheel journey from a planet's surface</text>
    <text x="570" y="360" font-size="27" fill="#9fc2ff">to the edge of the observable universe</text>
    <text x="570" y="424" font-size="20" fill="#c8d2ee" opacity="0.9">Real Keplerian orbits · 43,488 real galaxies · Lensed black holes</text>
    <text x="570" y="456" font-size="20" fill="#c8d2ee" opacity="0.9">Open source · React + Three.js · Runs in your browser</text>
    <text x="570" y="530" font-size="24" fill="#63d8ff">stellar.guushu.com/en</text>
  </g>
</svg>
