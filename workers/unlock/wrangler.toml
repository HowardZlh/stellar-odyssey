# Cloudflare Worker：stellar-unlock-cron —— 统一对账 + 运营通知的定时壳
# （REQUIREMENTS_UNLOCK.md §U4-1；入口 cron.ts 复用 index.ts 的 scheduled）。
#
# 2026-09-22 起部署形态（账号 D，见 docs/internal/UNLOCK_OPS.md「账号 D 部署」）：
#   - HTTP 面 `/api/*` 不在本 Worker：index.ts 经 `wrangler.pages.toml` dry-run
#     打包为 `out/_worker.js`，随静态导出一起 `wrangler pages deploy` 到 Pages 项目
#     `stellar-odyssey`；`stellar.guushu.com` 由 zone A（guushu.com 所在账号）
#     的橙云 CNAME 指向 `stellar-odyssey.pages.dev`。
#   - 本 Worker 只有 Cron（Pages 不支持 Cron Trigger），与 Pages 绑同一 D1。
#   - 旧形态（账号 A 上 zone route `stellar.guushu.com/api/*` + GitHub Pages
#     静态站 + Email Routing send_email 绑定）已下线。
#
# 部署由用户执行（Agent 只交付配置）。账号 D 无 zone，wrangler 用环境变量
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 指定目标账号；下方 account_id
# 写死为账号 D（CI 自定义权限 token 无权列账户，写死后跳过账户查询）。
#
# Secrets（wrangler secret put，严禁写入本文件；Pages 项目侧需再放一份）：
#   AFDIAN_USER_ID / AFDIAN_TOKEN / MBD_DEVELOPER_KEY / ED25519_PRIVATE_KEY
#   ALIPAY_APP_ID / ALIPAY_PRIVATE_KEY / ALIPAY_PUBLIC_KEY / ALIPAY_SELLER_ID
#   RESEND_API_KEY（运营通知发信；缺失 → 通知层 not_configured 降级）
name = "stellar-unlock-cron"
main = "cron.ts"
compatibility_date = "2026-08-01"
account_id = "d7bde027eff55880d8e5137421cc1ef6"

# 统一对账 cron（每 3 小时，D-z6 单 cron；Workers Free 每账户 5 排程限额，
# 账号 D 只有本项目，用 1）：爱发电退款巡检（A6 模式 A）+ 支付宝对账（M4：
# 超时 pending 关单 / 已付补发 / 退款吊销兜底——需 ALIPAY_* 与 ED25519
# Secrets 齐备，否则该段独立降级不影响爱发电巡检）+ 运营通知（每轮至多
# 1 封邮件，Resend HTTP）。子请求预算 ≤49 + 邮件 1（refundSync.ts 头注）。
[triggers]
crons = ["0 */3 * * *"]

# D1（Z 迭代 M1，REQUIREMENTS_ALIPAY_UNLOCK.md §4 / §9）。2026-09-22 于账号 D
# 重建（--location apac，国内用户就近），数据自账号 A 旧库 `d1 export` 导入。
[[d1_databases]]
binding = "UNLOCK_DB"
database_name = "stellar-unlock"
database_id = "0c13e71c-74d5-4b3b-841e-c600bd99bc52"
migrations_dir = "migrations"

[vars]
# 档位 ↔ 爱发电 plan_id（非机密；U6 三者全配置启用强制归档）
UNLOCK_PLAN_ID_WEEK = "f313936a965811f1aa675254001e7c00"
UNLOCK_PLAN_ID_MONTH = "eb51c1668fef11f180f752540025c377"
UNLOCK_PLAN_ID_YEAR = "b534981c965a11f1ba3952540025c377"
# 档位 ↔ 面包多作品 urlkey（非机密；对等 UNLOCK_PLAN_ID_*）
UNLOCK_MBD_URLKEY_WEEK = "YZaVk5ZtbQ=="
UNLOCK_MBD_URLKEY_MONTH = "YZaVk5ZuZA=="
UNLOCK_MBD_URLKEY_YEAR = "YZaVk5ZuZQ=="
# A6 退款巡检：回看天数；AUTO_REVOKE 空 = 模式 A 只检测登记（裁决 ⑧）
REFUND_LOOKBACK_DAYS = "15"
REFUND_AUTO_REVOKE = ""
# 运营通知：发件域 mail.guushu.com 已在 Resend 验证；收件 = 运营者本人
OPS_MAIL_FROM = "ops@mail.guushu.com"
OPS_MAIL_TO = "stevenzearo@163.com"
